# Frozen violations, one key per line, per rule.
# These are debt with a due date, not permission. Adding a key by hand
# to silence a new violation is the one move this file exists to make
# visible in review.
version: 1
rules:
  L1.COMPLEXITY_CEILING:
    review_by: 2027-03-03
    note: 'Exhaustive dispatch and mapping: the fake world''s execute() over every action, pluginSlices over every mounted plugin''s derived slice, the config migration over every key it moves, settingsFor over those keys, and validateConfig over every schema type. The branch count is the number of cases, and splitting it would hide the one place that proves something was not forgotten; revisit if any of them grows logic inside a case rather than delegating out of it. Two used to be here and are not any more: the doctor became a list of small checks, and plan() became a record of planners keyed by state, which the compiler holds exhaustive.'
    allow:
    - packages/workflow-ticket-to-qa/tests/walkthrough.test.ts:execute
    - packages/cli/src/slices.ts:pluginSlices
    - packages/cli/src/update.ts:migrateSettingsFile
    - packages/cli/src/update.ts:settingsFor
    - packages/core/src/config-schema.ts:validateConfig
