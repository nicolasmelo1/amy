name: release

on:
  push:
    branches: [main]

# Nothing here may read the repository's secrets by default. The one job that
# needs to write is the one below, and it says so itself.
permissions:
  contents: read

# One release at a time. Two runs racing would both try to open the version
# pull request, and the loser would leave a branch nobody asked for.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Version and publish in one job, deliberately.
  #
  # The obvious shape is two workflows: one that tags, one that publishes on
  # the tag. It does not work, and it fails silently — GitHub refuses to start
  # a workflow from a push made with the default `GITHUB_TOKEN`, so the
  # publish would wait for a tag event that never arrives. Keeping both here
  # means the tag is pushed by the same run that publishes.
  release:
    runs-on: ubuntu-latest
    # Dormant until somebody arms it, and green while dormant.
    #
    # The first release is deliberately after phase 12, so there is no npm
    # organisation and no token yet. Unarmed, this job fails on every push to
    # main — `GitHub Actions is not permitted to create or approve pull
    # requests` first, and a missing credential after that. A red build that
    # means nothing trains everybody to ignore the one that does.
    #
    # Arm it with one command, once, when the organisation exists:
    #
    #     gh variable set AMY_RELEASE --body on
    #
    # A variable rather than a secret, because a job condition cannot read a
    # secret, and because "is the release armed" is not itself a secret.
    if: vars.AMY_RELEASE == 'on'
    permissions:
      # The action pushes the version branch and the tags it creates.
      contents: write
      # And opens the pull request that carries the bump.
      pull-requests: write
      # npm provenance is signed with a short-lived OIDC token minted here.
      # Without this the publish still works and the attestation does not
      # exist, which is the quiet failure worth spelling out.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog reads history, and a shallow clone has none.
          fetch-depth: 0
          # Off, like every other job here. `changesets/action` pushes the
          # version branch, the commit and the tags through the GitHub API
          # rather than through git — that is what `push-with-git-cli: false`,
          # its default, means — so the credential this would leave in
          # `.git/config` is one nothing here uses.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # What makes `npm publish` authenticate: the token below is written
          # into an .npmrc for this registry only.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `sf`, for one command only: the version bump rewrites twenty-five
      # package.json files, so the dependency lock has to move with them or
      # the version pull request can never be green.
      #
      # A prebuilt binary rather than `cargo install`, because a Rust
      # toolchain in the one job nobody can take back is a cost with no
      # return. The digest is checked because a downloaded binary that
      # nothing verifies is a supply chain nobody is watching.
      - name: Install sf
        env:
          SF_VERSION: v0.3.0
        run: |
          base="https://github.com/nicolasmelo1/software-factory/releases/download/$SF_VERSION"
          curl -fsSL "$base/sf-x86_64-unknown-linux-gnu" -o sf
          curl -fsSL "$base/sf-x86_64-unknown-linux-gnu.sha256" -o sf.sha256
          printf '%s  sf\n' "$(cut -d' ' -f1 sf.sha256)" | sha256sum -c -
          chmod +x sf && sudo mv sf /usr/local/bin/sf
          sf --version
      # The suite before the publish, because a release is the one build
      # nobody can take back. `npm run gate` is not used here on purpose: it
      # runs every rule, and the pull request that produced this commit
      # already did.
      - run: npm run build
      - run: npm test
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # These four were renamed in v2 and the old names are a hard error
          # rather than a warning, which is the right call and is how this
          # was found: the first run on main said so and stopped.
          version-script: npm run release:version
          publish-script: npm run release:publish
          pr-title: "Version packages"
          commit-message: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance as an environment variable rather than in
          # publishConfig: in package.json it would make every local
          # `npm publish` fail, since a laptop cannot mint an OIDC token.
          NPM_CONFIG_PROVENANCE: "true"
